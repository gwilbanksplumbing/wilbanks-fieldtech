  <body>
    <div id="root"></div>
    <script>
      // Unregister all service workers and clear caches so updates always deliver
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          regs.forEach(r => r.unregister());
        });
      }
      // Clear all caches so iOS doesn't serve stale index.html
      if ('caches' in window) {
        caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
      }
    </script>
