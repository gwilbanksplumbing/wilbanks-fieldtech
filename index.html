      // Force nav reposition after iOS PWA viewport settles on cold launch
      function _fixNav() {
        var nav = document.getElementById('wc-nav');
        if (!nav) return;
        nav.style.bottom = '-1px';
        requestAnimationFrame(function() {
          nav.style.bottom = '0px';

      window.addEventListener('load', function() {
        setTimeout(_fixNav, 100);

      });
